networks:
  app-net:
    driver: bridge
    name: app-net

volumes:
  certbot-www:
  certbot-conf:

services:
  blue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL:      ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: checkrezerve:latest
    container_name: checkrezerve-blue
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NEXT_PUBLIC_SUPABASE_URL:      ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY:     ${SUPABASE_SERVICE_ROLE_KEY}
      ANTHROPIC_API_KEY:             ${ANTHROPIC_API_KEY}
      DEEPSEEK_API_KEY:              ${DEEPSEEK_API_KEY}
      ELEVENLABS_API_KEY:            ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID:           ${ELEVENLABS_VOICE_ID:-}
      WHISPER_SERVER_URL:            ${WHISPER_SERVER_URL:-http://checkrezerve-whisper:5001}
      SMS_PROVIDER:                  ${SMS_PROVIDER:-disabled}
      TWILIO_ACCOUNT_SID:            ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN:             ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER:            ${TWILIO_FROM_NUMBER:-}
      NETGSM_USERCODE:               ${NETGSM_USERCODE:-}
      NETGSM_PASSWORD:               ${NETGSM_PASSWORD:-}
      NETGSM_MSGHEADER:              ${NETGSM_MSGHEADER:-}
      IYZICO_API_KEY:                  ${IYZICO_API_KEY:-}
      IYZICO_SECRET_KEY:               ${IYZICO_SECRET_KEY:-}
      IYZICO_BASE_URL:                 ${IYZICO_BASE_URL:-https://sandbox.iyzipay.com}
      IYZICO_PLAN_STARTER_MONTHLY_REF: ${IYZICO_PLAN_STARTER_MONTHLY_REF:-}
      IYZICO_PLAN_STARTER_YEARLY_REF:  ${IYZICO_PLAN_STARTER_YEARLY_REF:-}
      IYZICO_PLAN_PRO_MONTHLY_REF:     ${IYZICO_PLAN_PRO_MONTHLY_REF:-}
      IYZICO_PLAN_PRO_YEARLY_REF:      ${IYZICO_PLAN_PRO_YEARLY_REF:-}
      ADMIN_SECRET:                    ${ADMIN_SECRET}
      ADMIN_PASSWORD:                  ${ADMIN_PASSWORD:-}
      NODE_ENV:  production
      PORT:      3001
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 60s

  green:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL:      ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: checkrezerve:latest
    container_name: checkrezerve-green
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      NEXT_PUBLIC_SUPABASE_URL:      ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY:     ${SUPABASE_SERVICE_ROLE_KEY}
      ANTHROPIC_API_KEY:             ${ANTHROPIC_API_KEY}
      DEEPSEEK_API_KEY:              ${DEEPSEEK_API_KEY}
      ELEVENLABS_API_KEY:            ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID:           ${ELEVENLABS_VOICE_ID:-}
      WHISPER_SERVER_URL:            ${WHISPER_SERVER_URL:-http://checkrezerve-whisper:5001}
      SMS_PROVIDER:                  ${SMS_PROVIDER:-disabled}
      TWILIO_ACCOUNT_SID:            ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN:             ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER:            ${TWILIO_FROM_NUMBER:-}
      NETGSM_USERCODE:               ${NETGSM_USERCODE:-}
      NETGSM_PASSWORD:               ${NETGSM_PASSWORD:-}
      NETGSM_MSGHEADER:              ${NETGSM_MSGHEADER:-}
      IYZICO_API_KEY:                  ${IYZICO_API_KEY:-}
      IYZICO_SECRET_KEY:               ${IYZICO_SECRET_KEY:-}
      IYZICO_BASE_URL:                 ${IYZICO_BASE_URL:-https://sandbox.iyzipay.com}
      IYZICO_PLAN_STARTER_MONTHLY_REF: ${IYZICO_PLAN_STARTER_MONTHLY_REF:-}
      IYZICO_PLAN_STARTER_YEARLY_REF:  ${IYZICO_PLAN_STARTER_YEARLY_REF:-}
      IYZICO_PLAN_PRO_MONTHLY_REF:     ${IYZICO_PLAN_PRO_MONTHLY_REF:-}
      IYZICO_PLAN_PRO_YEARLY_REF:      ${IYZICO_PLAN_PRO_YEARLY_REF:-}
      ADMIN_SECRET:                    ${ADMIN_SECRET}
      ADMIN_PASSWORD:                  ${ADMIN_PASSWORD:-}
      NODE_ENV:  production
      PORT:      3002
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/api/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: checkrezerve-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    networks:
      - app-net

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: checkrezerve-whisper
    restart: unless-stopped
    expose:
      - "5001"
    environment:
      ASR_MODEL: base
      ASR_ENGINE: openai_whisper
    networks:
      - app-net

  certbot:
    image: certbot/certbot:latest
    container_name: checkrezerve-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    networks:
      - app-net
