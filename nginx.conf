# VPS için Nginx reverse proxy — checkrezerve.com
# Blue-Green deployment:
# deploy.sh script'i conf'taki upstream adresini günceller ve nginx reload yapar
# Aktif slot: checkrezerve-blue:3001 veya checkrezerve-green:3002

upstream nextjs_upstream {
    server checkrezerve-blue:3001;
    keepalive 64;
}

# HTTP → HTTPS yönlendirme (ACME challenge hariç)
server {
    listen 80;
    listen [::]:80;
    server_name checkrezerve.com www.checkrezerve.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS ana sunucu
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name checkrezerve.com www.checkrezerve.com;

    ssl_certificate     /etc/letsencrypt/live/checkrezerve.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkrezerve.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/checkrezerve.com/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Frame-Options           "SAMEORIGIN"                             always;
    add_header X-Content-Type-Options    "nosniff"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"        always;
    add_header Permissions-Policy        "geolocation=(), microphone=(self), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://posarvagedpqtsrcrwfe.supabase.co wss://posarvagedpqtsrcrwfe.supabase.co https://api.twilio.com https://api.netgsm.com.tr https://appleid.apple.com https://accounts.google.com https://*.googleapis.com; frame-src 'self' https://appleid.apple.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /sw.js {
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        proxy_pass http://nextjs_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_cache_bypass  $http_upgrade;
    }
}
